"11-28": "28.11.1964. – Lansiran Mariner 4, prva uspješna misija koja je poslala fotografije Marsa iz blizine."
"11-29": "29.11.1890. – Prvi put puštena u rad električna mreža u Japanu (Tokio)."
"11-30": "30.11.1954. – Prvi put potvrđen pad meteorita koji je direktno pogodio osobu u Alabami, SAD."
