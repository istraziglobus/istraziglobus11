"12-20": "20.12.1951. – Eksperimentalni reaktor EBR-1 u Ajdahou postao prva nuklearna elektrana koja je proizvela struju."
"12-21": "21.12.1968. – Lansiran Apollo 8, prva misija sa ljudskom posadom koja je napustila Zemljinu orbitu i obletjela Mjesec."
