baseURL = "https://www.istraziglobus.com/"
relativeURLs = false
canonifyURLs = false
languageCode = "sr"
title = "Istraži Globus - Vaša Avantura Počinje Ovdje"
disablePathToLower = false # Preporučuje se za očuvanje velikih slova u URL-ovima
pluralizeListTitles = false
trailingSlash = false
uglyURLs = false
disablePathExternalEmptyDirs = true
removePathAccents = true

[taxonomies]
  country = "countries"
  city = "cities"

[cascade._build]
  list = "never"
  sitemap = "never"

[params]
  description = "Sajt za putovanja i avanture"
  # Dodatni parametri koje možeš kasnije da proširiš
  # Hugo će automatski tražiti sadržaj u 'posts', 'articles', 'blog' ili šta god definišeš.
  # Ako želiš da povlači sve stranice, možeš da staviš sve foldere sa člancima ovde.
  mainSections = ["koracima-balkana", "posts", "destinacije", "ukusi-svijeta", "priroda-svijeta", "istorijski-kutak", "avio-svijet", "sport-i-putovanja", "putovanja-u-brojevima", "zanimljivosti-svijeta"]


[outputs]
  home = ["HTML", "RSS"] # Hugo podrazumevani izlazi za home stranicu

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # Omogućava korišćenje HTML-a direktno u Markdownu (kao što je tvoj slučaj)


[related]
threshold = 80
includeNewer = true
toLower = true

[[related.indices]]
name = "tags"
weight = 100

[[related.indices]]
name = "categories"
weight = 80


# Moguće je dodati konfiguracijiu za RSS feed, sitemap itd.

[permalinks]
  posts = "/:section/:filename"
  koracima-balkana = "/koracima-balkana/:filename"
  gradske-price = "/gradske-price/:filename"
  destinacije-mjeseca = "/destinacije-mjeseca/:filename"
  putni-vodici = "/putni-vodici/:filename"
  gastronomski-put = "/gastronomski-put/:filename"
  priroda-svijeta = "/priroda-svijeta/:filename"
  zapisi-vremena = "/zapisi-vremena/:filename"
  nebeske-rute = "/nebeske-rute/:filename"
  sampionski-plamen = "/sampionski-plamen/:filename"
  top-5 = "/top-5/:filename"
  postanski-tragovi = "/postanski-tragovi/:filename"
  neobicni-svijet = "/neobicni-svijet/:filename"
  kulturni-mozaik = "/kulturni-mozaik/:filename"
  mitski-kult = "/mitski-kult/:filename"
  geo-kutak = "/geo-kutak/:filename"
  portreti-moci = "/portreti-moci/:filename"
  stranice-kadra = "/stranice-kadra/:filename"
  prirodna-riznica = "/prirodna-riznica/:filename"
  tihe-megastrukture = "/tihe-megastrukture/:filename"
  nauticki-dnevnik = "/nauticki-dnevnik/:filename"


