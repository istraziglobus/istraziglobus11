{{/* layouts/shortcodes/figcredit.html */}}
{{ $src := .Get "src" | default "" }}
{{ $alt := .Get "alt" | default "" }}
{{ $author := .Get "author" | default "" }}
{{ $source := .Get "source" | default "" }}
{{ $sourceURL := .Get "source_url" | default "" }}

<figure class="article-image-box">
  <img src="{{ $src | relURL }}" alt="{{ $alt }}" loading="lazy">

  {{ if or $author $source }}
  <figcaption class="image-credit">
    {{ with $author }}Foto: {{ . }}{{ end }}
    {{ if and $author $source }} ({{ end }}
    {{ with $source }}
      {{ if $sourceURL }}
        <a href="{{ $sourceURL }}" target="_blank" rel="noopener">{{ . }}</a>
      {{ else }}
        {{ . }}
      {{ end }}
    {{ end }}
    {{ if and $author $source }} ){{ end }}
  </figcaption>
  {{ end }}
</figure>
