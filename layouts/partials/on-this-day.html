{{ $today := now.Format "01-02" }}
{{ $entry := index site.Data.dnevni_globus $today }}

{{ if $entry }}
  <div class="daily-globus-card">

    <div class="daily-globus-media">
    </div>

    <div class="daily-globus-body">
      <div class="daily-globus-kicker">Dnevni globus</div>
      <div class="daily-globus-date">{{ $entry | truncate 10 "" }}</div>
      <p class="daily-globus-text">{{ $entry }}</p>
    </div>

  </div>
{{ else }}
  <div class="daily-globus-card daily-globus-card--placeholder">
    <div class="daily-globus-body">
      <div class="daily-globus-kicker">Dnevni globus</div>
      <div class="daily-globus-date">{{ now.Format "02.01.2006" }}</div>
      <p class="daily-globus-text">Sekcija “Na današnji dan” uskoro dostupna.</p>
    </div>
  </div>
{{ end }}
