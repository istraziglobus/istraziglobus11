<section class="travel-tips-section section-alternate-bg">
    <div class="container text-center">
        <!-- Naslov sekcije sa tvojom klasom -->
        <h2 class="section-title">SAVJETI ZA PUTOVANJA</h2>

        <div class="instagram-grid">
            {{ range first 3 (where site.RegularPages "Section" "savjeti") }}
            <a href="{{ .RelPermalink }}" class="insta-card" style="background-image: url('{{ .Params.image | absURL }}');">
                <div class="insta-overlay">
                    <div class="insta-content">
                        <span class="insta-subtitle">Savjet</span>
                        <h3 class="insta-title">{{ .Title }}</h3>
                        {{ with .Params.description }}
                            <p class="insta-description">{{ . }}</p>
                        {{ end }}
                    </div>
                </div>
            </a>
            {{ end }}
        </div>

        <!-- Dugme koje vodi na sve članke -->
        <div class="button-container">
            <a href="{{ "/savjeti/" | relURL }}" class="btn btn-secondary">Pogledaj sve članke</a>
        </div>
    </div>
</section>
