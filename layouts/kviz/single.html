{{ define "main" }}

<style>
    /* Pozadina prilagođena i za desktop i za mobilne */
    .single-kviz-bg {
        background: linear-gradient(rgba(10, 10, 10, 0.232), rgba(10, 10, 10, 0.204)), url('/slike/kviz/pozadina.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        width: 100%;
        min-height: calc(100vh - 120px); 
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 20px 10px; 
    }

    /* Kutija kviza */
    .quiz-box-glow {
        background: rgba(20, 20, 20, 0.8) !important;
        border: 1px solid rgba(46, 204, 113, 0.2) !important;
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(46, 204, 113, 0.08) !important;
        border-radius: 16px;
        padding: 25px; 
        width: 100%;
        max-width: 650px; 
        min-height: 440px; 
        box-sizing: border-box;
        position: relative;
        display: flex;
        flex-direction: column;
        margin: auto 0;
    }

    @media (min-width: 768px) {
        .quiz-box-glow {
            padding: 35px;
            height: 480px; 
        }
    }

    /* Traka tajmera */
    .timer-bar-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 5px;
        background: rgba(255, 255, 255, 0.05);
    }
    
    #timer-bar {
        width: 100%;
        height: 100%;
        background: #2ecc71;
        transition: width 1s linear, background-color 0.3s ease;
    }

    /* Izgled dugmadi za odgovore */
    .quiz-option-btn {
        background: rgba(35, 35, 35, 0.7) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        color: #ffffff !important;
        width: 100%;
        text-align: left;
        padding: 14px 20px;
        font-size: 1.05rem;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease !important;
        margin-bottom: 10px;
        -webkit-tap-highlight-color: transparent; 
    }

    @media (hover: hover) {
        .quiz-option-btn:not(:disabled):hover {
            background: rgba(46, 204, 113, 0.12) !important;
            border-color: #2ecc71 !important;
            transform: translateX(4px);
        }
    }

    /* Stil za dugme Dalje */
    .next-btn-style {
        padding: 12px 32px;
        cursor: pointer;
        background: #2ecc71;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        font-size: 1rem;
        transition: background 0.2s;
    }
    .next-btn-style:hover {
        background: #27ae60;
    }

    /* Stil za dugme zvuka */
    .mute-btn-style {
        background: rgba(0,0,0,0.3); 
        color: #2ecc71; 
        border: 1px solid rgba(255,255,255,0.05); 
        padding: 4px 12px; 
        border-radius: 4px; 
        cursor: pointer; 
        font-size: 1.1rem; 
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .mute-btn-style:hover {
        border-color: #2ecc71;
        background: rgba(46, 204, 113, 0.1);
    }
</style>

<div class="single-kviz-bg">
    
    <div id="quiz-data-holder" data-questions="{{ .Params.pitanja | jsonify | safeHTML }}" style="display: none;"></div>

    <article class="quiz-box-glow">
        <div class="timer-bar-container">
            <div id="timer-bar"></div>
        </div>

        <header id="quiz-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; flex-shrink: 0;">
            <h1 style="font-size: 1.3rem; color: #ffffff; margin: 0; padding-right: 10px; line-height: 1.3;">{{ .Title }}</h1>
            
            <div style="display: flex; gap: 8px; align-items: center; flex-shrink: 0;">
                <button id="mute-btn" class="mute-btn-style" onclick="toggleMute()" title="Uključi/Isključi zvuk">🔊</button>
                <span id="timer-text" style="font-family: monospace; font-size: 1.1rem; color: #2ecc71; font-weight: bold; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.05);">20s</span>
            </div>
        </header>

        <section id="quiz-interface" style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between;">
            <div>
                <div style="min-height: 50px; margin-bottom: 15px;">
                    <h3 id="question-text" style="color: #ffffff; font-size: 1.2rem; line-height: 1.4; font-weight: 600; margin: 0;">
                        Učitavanje...
                    </h3>
                </div>

                <div id="options-container"></div>
            </div>

            <div style="margin-top: 15px; min-height: 45px; display: flex; justify-content: flex-end; align-items: center; flex-shrink: 0;">
                <button id="next-btn" class="next-btn-style" style="display: none;" onclick="nextQuestion()">
                    Dalje &rarr;
                </button>
            </div>
        </section>

        <section id="result-box" style="display: none; flex-grow: 1; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px 0;">
            <p id="score-text" style="font-size: 2rem; font-weight: bold; color: #2ecc71; margin: 0 0 15px 0;"></p>
            <p id="evaluation-text" style="font-size: 1.05rem; color: #cccccc; max-width: 500px; margin: 0 0 30px 0; line-height: 1.5;"></p>
            <button onclick="location.reload()" style="padding: 12px 35px; cursor: pointer; background: transparent; color: #ffffff; border: 2px solid #2ecc71; border-radius: 6px; font-weight: bold; font-size: 1rem; transition: all 0.2s;" onmouseover="this.style.background='#2ecc71'" onmouseout="this.style.background='transparent'">
                Ponovi testiranje
            </button>
        </section>
    </article>

</div>

<script>
    const dataHolder = document.getElementById("quiz-data-holder");
    let rawQuestions = JSON.parse(dataHolder.getAttribute("data-questions"));
    
    let isMuted = localStorage.getItem("quiz_muted") === "true";

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function toggleMute() {
        isMuted = !isMuted;
        localStorage.setItem("quiz_muted", isMuted);
        updateMuteButton();
    }

    function updateMuteButton() {
        const muteBtn = document.getElementById("mute-btn");
        if (isMuted) {
            muteBtn.innerText = "🔇";
            muteBtn.style.color = "#e74c3c"; 
        } else {
            muteBtn.innerText = "🔊";
            muteBtn.style.color = "#2ecc71"; 
        }
    }

    function playSound(isCorrect) {
        if (isMuted) return; 

        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (isCorrect) {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
                oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); 
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.25);
            } else {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(180, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.15); 
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        } catch (e) {
            console.log("AudioContext nije podržan.");
        }
    }
    
    let currentQuestionIndex = 0;
    let score = 0;
    
    let timeLeft = 15;
    let timerInterval = null;

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 15;
        
        const timerText = document.getElementById("timer-text");
        const timerBar = document.getElementById("timer-bar");
        
        timerText.innerText = `${timeLeft}s`;
        timerText.style.color = "#2ecc71";
        timerBar.style.width = "100%";
        timerBar.style.backgroundColor = "#2ecc71";

        timerInterval = setInterval(() => {
            timeLeft--;
            timerText.innerText = `${timeLeft}s`;
            
            let percentage = (timeLeft / 15) * 100;
            timerBar.style.width = `${percentage}%`;

            if (timeLeft <= 10 && timeLeft > 5) {
                timerText.style.color = "#f39c12";
                timerBar.style.backgroundColor = "#f39c12";
            } else if (timeLeft <= 5) {
                timerText.style.color = "#e74c3c";
                timerBar.style.backgroundColor = "#e74c3c";
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                handleTimeOut();
            }
        }, 1000);
    }

    // POPRAVLJENO: Kada istekne vrijeme, samo zaključavamo dugmad bez bojenja tačnog odgovora
    function handleTimeOut() {
        playSound(false); 
        
        const optionsContainerEl = document.getElementById("options-container");
        const buttons = optionsContainerEl.getElementsByTagName("button");
        const nextBtn = document.getElementById("next-btn");

        // Samo onemogući klikove na sve opcije
        for (let button of buttons) {
            button.disabled = true;
            button.style.opacity = "0.6"; // Blago ih osenčimo da se vidi da su zaključane
        }

        if (currentQuestionIndex < rawQuestions.length - 1) {
            nextBtn.style.display = "block";
        } else {
            nextBtn.innerText = "Kraj";
            nextBtn.style.display = "block";
        }
    }

    function loadQuestion() {
        const currentQuestion = rawQuestions[currentQuestionIndex];
        const questionTextEl = document.getElementById("question-text");
        const optionsContainerEl = document.getElementById("options-container");
        const nextBtn = document.getElementById("next-btn");

        nextBtn.style.display = "none";
        optionsContainerEl.innerHTML = "";
        
        questionTextEl.innerHTML = `<span style="color: #2ecc71;">${currentQuestionIndex + 1}.</span> ${currentQuestion.pitanje}`;

        currentQuestion.opcije.forEach((option, index) => {
            const button = document.createElement("button");
            button.innerText = option;
            button.classList.add("quiz-option-btn");
            button.onclick = () => selectOption(index, button);
            optionsContainerEl.appendChild(button);
        });

        startTimer();
    }

    function selectOption(selectedIndex, selectedButton) {
        clearInterval(timerInterval);
        
        const currentQuestion = rawQuestions[currentQuestionIndex];
        const optionsContainerEl = document.getElementById("options-container");
        const buttons = optionsContainerEl.getElementsByTagName("button");
        const nextBtn = document.getElementById("next-btn");

        for (let button of buttons) {
            button.disabled = true;
        }

        if (selectedIndex === currentQuestion.tacan) {
            selectedButton.style.setProperty('background', '#2ecc71', 'important');
            selectedButton.style.setProperty('border-color', '#2ecc71', 'important');
            selectedButton.style.color = "#ffffff";
            score++;
            playSound(true);  
        } else {
            selectedButton.style.setProperty('background', '#e74c3c', 'important');
            selectedButton.style.setProperty('border-color', '#e74c3c', 'important');
            selectedButton.style.color = "#ffffff";
            
            buttons[currentQuestion.tacan].style.setProperty('background', '#2ecc71', 'important');
            buttons[currentQuestion.tacan].style.setProperty('border-color', '#2ecc71', 'important');
            buttons[currentQuestion.tacan].style.color = "#ffffff";
            playSound(false); 
        }

        if (currentQuestionIndex < rawQuestions.length - 1) {
            nextBtn.style.display = "block";
        } else {
            nextBtn.innerText = "Kraj";
            nextBtn.style.display = "block";
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < rawQuestions.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        document.getElementById("quiz-interface").style.display = "none";
        document.getElementById("quiz-header").style.display = "none";
        document.querySelector(".timer-bar-container").style.display = "none";
        
        const resultBox = document.getElementById("result-box");
        const scoreText = document.getElementById("score-text");
        const evalText = document.getElementById("evaluation-text");
        
        const total = rawQuestions.length;
        const percentage = (score / total) * 100;
        
        scoreText.innerText = `${Math.round(percentage)}% Uspješnosti`;
        
        if (percentage >= 90) {
            evalText.innerText = "Izuzetan nivo opšte informisanosti i preciznog poznavanja geografskih detalja i prirodnih zakonitosti.";
        } else if (percentage >= 70) {
            evalText.innerText = "Visok nivo znanja uz minimalne propuste u domenima složenijih geopolitičkih i morfoloških pitanja.";
        } else if (percentage >= 50) {
            evalText.innerText = "Prosječan rezultat koji ukazuje na solidno poznavanje osnova, uz primjetan prostor za dodatnu edukaciju.";
        } else {
            evalText.innerText = "Nedovoljan procenat tačnih odgovora za prelaznu ocjenu opšteg znanja. Potrebno je dublje obnavljanje gradiva.";
        }
        
        resultBox.style.display = "flex";
    }

    window.onload = () => {
        updateMuteButton(); 
        if(rawQuestions && rawQuestions.length > 0) {
            shuffleArray(rawQuestions); 
            loadQuestion();
        } else {
            document.getElementById("question-text").innerText = "Greška prilikom učitavanja pitanja.";
        }
    };
</script>
{{ end }}
